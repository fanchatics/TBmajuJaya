<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Cat Kayu &amp; Besi Kuas Nippon 1kg">
  <defs>
    <linearGradient id="bg-cat-kayu-besi-kuas-nippon-1kg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#450a0a"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="card-cat-kayu-besi-kuas-nippon-1kg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <filter id="shadow-cat-kayu-besi-kuas-nippon-1kg" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity="0.38"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" fill="url(#bg-cat-kayu-besi-kuas-nippon-1kg)"/>
  <circle cx="520" cy="90" r="190" fill="#f59e0b" fill-opacity="0.12"/>
  <circle cx="80" cy="520" r="210" fill="#ffffff" fill-opacity="0.05"/>

  <!-- Top Category & Store Header -->
  <rect x="36" y="32" width="190" height="34" rx="17" fill="#f59e0b"/>
  <text x="131" y="54" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="800" fill="#0f172a" letter-spacing="1.2">CAT &amp; PELAPIS</text>
  <text x="564" y="54" text-anchor="end" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#cbd5e1" letter-spacing="1">TB MAJU JAYA</text>

  <!-- Center Stage Backdrop -->
  <rect x="48" y="84" width="504" height="340" rx="28" fill="url(#card-cat-kayu-besi-kuas-nippon-1kg)" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.5"/>

  <!-- Bespoke Product Illustration -->
  <g filter="url(#shadow-cat-kayu-besi-kuas-nippon-1kg)">
                    <!-- Nippon 1kg Enamel Tin + Paintbrush -->
                <rect x="165" y="165" width="175" height="210" rx="16" fill="#dc2626" stroke="#fde68a" stroke-width="4"/>
                <ellipse cx="252" cy="165" rx="87" ry="16" fill="#e2e8f0" stroke="#94a3b8" stroke-width="3"/>
                <rect x="185" y="215" width="135" height="90" rx="10" fill="#fef3c7"/>
                <text x="252" y="252" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="900" fill="#991b1b">NIPPON</text>
                <text x="252" y="280" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#78350f">KAYU &amp; BESI • 1KG</text>
                <!-- Angled Paintbrush -->
                <g transform="rotate(22 415 250)">
                  <rect x="385" y="120" width="48" height="72" rx="4" fill="#fde68a" stroke="#d97706" stroke-width="3"/>
                  <rect x="385" y="120" width="48" height="24" fill="#f59e0b"/>
                  <rect x="383" y="192" width="52" height="22" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
                  <path d="M392 214 H426 L418 345 Q409 362 400 345 Z" fill="#b45309" stroke="#78350f" stroke-width="3"/>
                </g>
  </g>

  <!-- Bottom Product Label Plate -->
  <rect x="36" y="446" width="528" height="122" rx="20" fill="#0f172a" fill-opacity="0.82" stroke="#f59e0b" stroke-opacity="0.55" stroke-width="1.5"/>
  <text x="60" y="488" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="800" fill="#f8fafc">Cat Kayu &amp; Besi Kuas 1kg</text>
  <text x="60" y="518" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#e2e8f0">Nippon</text>
  <text x="60" y="548" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#f59e0b" letter-spacing="1.4">SATUAN: KALENG</text>
</svg>