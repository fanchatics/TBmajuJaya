<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Saklar Tunggal Broco">
  <defs>
    <linearGradient id="bg-saklar-tunggal-broco" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2540"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="card-saklar-tunggal-broco" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <filter id="shadow-saklar-tunggal-broco" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity="0.38"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" fill="url(#bg-saklar-tunggal-broco)"/>
  <circle cx="520" cy="90" r="190" fill="#38bdf8" fill-opacity="0.12"/>
  <circle cx="80" cy="520" r="210" fill="#ffffff" fill-opacity="0.05"/>

  <!-- Top Category & Store Header -->
  <rect x="36" y="32" width="190" height="34" rx="17" fill="#38bdf8"/>
  <text x="131" y="54" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="800" fill="#0f172a" letter-spacing="1.2">INSTALASI LISTRIK</text>
  <text x="564" y="54" text-anchor="end" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#cbd5e1" letter-spacing="1">TB MAJU JAYA</text>

  <!-- Center Stage Backdrop -->
  <rect x="48" y="84" width="504" height="340" rx="28" fill="url(#card-saklar-tunggal-broco)" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.5"/>

  <!-- Bespoke Product Illustration -->
  <g filter="url(#shadow-saklar-tunggal-broco)">
                    <!-- Broco Single Wall Switch -->
                <rect x="175" y="125" width="250" height="250" rx="28" fill="#f8fafc" stroke="#cbd5e1" stroke-width="6"/>
                <rect x="215" y="165" width="170" height="170" rx="16" fill="#e2e8f0" stroke="#94a3b8" stroke-width="4"/>
                <rect x="242" y="185" width="116" height="130" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="3"/>
                <line x1="252" y1="250" x2="348" y2="250" stroke="#cbd5e1" stroke-width="3"/>
                <rect x="288" y="205" width="24" height="6" rx="3" fill="#0284c7"/>
                <text x="300" y="360" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="800" fill="#64748b" letter-spacing="2">BROCO</text>
  </g>

  <!-- Bottom Product Label Plate -->
  <rect x="36" y="446" width="528" height="122" rx="20" fill="#0f172a" fill-opacity="0.82" stroke="#38bdf8" stroke-opacity="0.55" stroke-width="1.5"/>
  <text x="60" y="488" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="800" fill="#f8fafc">Saklar Tunggal Broco</text>
  <text x="60" y="518" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#e2e8f0"></text>
  <text x="60" y="548" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#38bdf8" letter-spacing="1.4">SATUAN: PCS</text>
</svg>