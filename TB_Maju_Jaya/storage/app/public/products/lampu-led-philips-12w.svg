<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Lampu LED Philips 12W">
  <defs>
    <linearGradient id="bg-lampu-led-philips-12w" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="card-lampu-led-philips-12w" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <filter id="shadow-lampu-led-philips-12w" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity="0.38"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" fill="url(#bg-lampu-led-philips-12w)"/>
  <circle cx="520" cy="90" r="190" fill="#fde047" fill-opacity="0.12"/>
  <circle cx="80" cy="520" r="210" fill="#ffffff" fill-opacity="0.05"/>

  <!-- Top Category & Store Header -->
  <rect x="36" y="32" width="190" height="34" rx="17" fill="#fde047"/>
  <text x="131" y="54" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="800" fill="#0f172a" letter-spacing="1.2">INSTALASI LISTRIK</text>
  <text x="564" y="54" text-anchor="end" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#cbd5e1" letter-spacing="1">TB MAJU JAYA</text>

  <!-- Center Stage Backdrop -->
  <rect x="48" y="84" width="504" height="340" rx="28" fill="url(#card-lampu-led-philips-12w)" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.5"/>

  <!-- Bespoke Product Illustration -->
  <g filter="url(#shadow-lampu-led-philips-12w)">
                    <!-- Glowing Philips LED Bulb 12W -->
                <circle cx="300" cy="215" r="130" fill="#fde047" fill-opacity="0.18"/>
                <circle cx="300" cy="200" r="82" fill="#ffffff" stroke="#e2e8f0" stroke-width="4"/>
                <polygon points="242,255 358,255 338,332 262,332" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="3"/>
                <text x="300" y="300" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="900" fill="#1d4ed8">PHILIPS 12W</text>
                <!-- E27 Screw Base -->
                <rect x="268" y="332" width="64" height="44" rx="10" fill="#94a3b8" stroke="#475569" stroke-width="3"/>
                <line x1="268" y1="346" x2="332" y2="346" stroke="#475569" stroke-width="3"/>
                <line x1="268" y1="360" x2="332" y2="360" stroke="#475569" stroke-width="3"/>
                <path d="M282 376 Q300 395 318 376 Z" fill="#1e293b"/>
  </g>

  <!-- Bottom Product Label Plate -->
  <rect x="36" y="446" width="528" height="122" rx="20" fill="#0f172a" fill-opacity="0.82" stroke="#fde047" stroke-opacity="0.55" stroke-width="1.5"/>
  <text x="60" y="488" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="800" fill="#f8fafc">Lampu LED Philips 12W</text>
  <text x="60" y="518" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#e2e8f0"></text>
  <text x="60" y="548" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#fde047" letter-spacing="1.4">SATUAN: PCS</text>
</svg>