<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Palu Konde 1kg">
  <defs>
    <linearGradient id="bg-palu-konde-1kg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="card-palu-konde-1kg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <filter id="shadow-palu-konde-1kg" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity="0.38"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" fill="url(#bg-palu-konde-1kg)"/>
  <circle cx="520" cy="90" r="190" fill="#fbbf24" fill-opacity="0.12"/>
  <circle cx="80" cy="520" r="210" fill="#ffffff" fill-opacity="0.05"/>

  <!-- Top Category & Store Header -->
  <rect x="36" y="32" width="190" height="34" rx="17" fill="#fbbf24"/>
  <text x="131" y="54" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="800" fill="#0f172a" letter-spacing="1.2">PERKAKAS &amp; ALAT</text>
  <text x="564" y="54" text-anchor="end" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#cbd5e1" letter-spacing="1">TB MAJU JAYA</text>

  <!-- Center Stage Backdrop -->
  <rect x="48" y="84" width="504" height="340" rx="28" fill="url(#card-palu-konde-1kg)" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.5"/>

  <!-- Bespoke Product Illustration -->
  <g filter="url(#shadow-palu-konde-1kg)">
                    <!-- Ball-Peen Hammer (Palu Konde 1kg) -->
                <g transform="rotate(-32 300 255)">
                  <!-- Hickory Wooden Handle -->
                  <rect x="282" y="175" width="36" height="230" rx="14" fill="#d97706" stroke="#92400e" stroke-width="4"/>
                  <!-- Forged Steel Head + Ball Peen -->
                  <rect x="195" y="125" width="165" height="58" rx="12" fill="#94a3b8" stroke="#475569" stroke-width="4"/>
                  <circle cx="385" cy="154" r="26" fill="#94a3b8" stroke="#475569" stroke-width="4"/>
                  <rect x="180" y="132" width="22" height="44" rx="4" fill="#e2e8f0" stroke="#475569" stroke-width="3"/>
                </g>
  </g>

  <!-- Bottom Product Label Plate -->
  <rect x="36" y="446" width="528" height="122" rx="20" fill="#0f172a" fill-opacity="0.82" stroke="#fbbf24" stroke-opacity="0.55" stroke-width="1.5"/>
  <text x="60" y="488" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="800" fill="#f8fafc">Palu Konde 1kg</text>
  <text x="60" y="518" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#e2e8f0"></text>
  <text x="60" y="548" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#fbbf24" letter-spacing="1.4">SATUAN: PCS</text>
</svg>