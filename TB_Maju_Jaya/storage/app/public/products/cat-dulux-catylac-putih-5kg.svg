<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Cat Dulux Catylac Putih 5kg">
  <defs>
    <linearGradient id="bg-cat-dulux-catylac-putih-5kg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#172554"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="card-cat-dulux-catylac-putih-5kg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <filter id="shadow-cat-dulux-catylac-putih-5kg" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity="0.38"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" fill="url(#bg-cat-dulux-catylac-putih-5kg)"/>
  <circle cx="520" cy="90" r="190" fill="#38bdf8" fill-opacity="0.12"/>
  <circle cx="80" cy="520" r="210" fill="#ffffff" fill-opacity="0.05"/>

  <!-- Top Category & Store Header -->
  <rect x="36" y="32" width="190" height="34" rx="17" fill="#38bdf8"/>
  <text x="131" y="54" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="800" fill="#0f172a" letter-spacing="1.2">CAT &amp; PELAPIS</text>
  <text x="564" y="54" text-anchor="end" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#cbd5e1" letter-spacing="1">TB MAJU JAYA</text>

  <!-- Center Stage Backdrop -->
  <rect x="48" y="84" width="504" height="340" rx="28" fill="url(#card-cat-dulux-catylac-putih-5kg)" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.5"/>

  <!-- Bespoke Product Illustration -->
  <g filter="url(#shadow-cat-dulux-catylac-putih-5kg)">
                    <!-- Dulux Catylac 5kg Bucket -->
                <path d="M185 190 Q300 95 415 190" fill="none" stroke="#94a3b8" stroke-width="6"/>
                <polygon points="190,155 410,155 392,380 208,380" fill="#f8fafc" stroke="#cbd5e1" stroke-width="4"/>
                <rect x="182" y="138" width="236" height="24" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="3"/>
                <!-- Colorful Dulux Wave -->
                <path d="M202 245 Q260 200 300 240 T398 230 L394 310 L206 310 Z" fill="#1d4ed8"/>
                <path d="M204 265 Q260 230 300 260 T396 255" fill="none" stroke="#f59e0b" stroke-width="8"/>
                <path d="M205 280 Q260 245 300 275 T395 270" fill="none" stroke="#10b981" stroke-width="6"/>
                <text x="300" y="215" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="900" fill="#1e3a8a">Catylac</text>
                <text x="300" y="352" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="900" fill="#0f172a">PUTIH • 5 KG</text>
  </g>

  <!-- Bottom Product Label Plate -->
  <rect x="36" y="446" width="528" height="122" rx="20" fill="#0f172a" fill-opacity="0.82" stroke="#38bdf8" stroke-opacity="0.55" stroke-width="1.5"/>
  <text x="60" y="488" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="800" fill="#f8fafc">Cat Dulux Catylac Putih</text>
  <text x="60" y="518" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#e2e8f0">5kg</text>
  <text x="60" y="548" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#38bdf8" letter-spacing="1.4">SATUAN: KALENG</text>
</svg>