<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Meteran Roll 5m Stanley">
  <defs>
    <linearGradient id="bg-meteran-roll-5m-stanley" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#422006"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="card-meteran-roll-5m-stanley" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <filter id="shadow-meteran-roll-5m-stanley" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity="0.38"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" fill="url(#bg-meteran-roll-5m-stanley)"/>
  <circle cx="520" cy="90" r="190" fill="#facc15" fill-opacity="0.12"/>
  <circle cx="80" cy="520" r="210" fill="#ffffff" fill-opacity="0.05"/>

  <!-- Top Category & Store Header -->
  <rect x="36" y="32" width="190" height="34" rx="17" fill="#facc15"/>
  <text x="131" y="54" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="800" fill="#0f172a" letter-spacing="1.2">PERKAKAS &amp; ALAT</text>
  <text x="564" y="54" text-anchor="end" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#cbd5e1" letter-spacing="1">TB MAJU JAYA</text>

  <!-- Center Stage Backdrop -->
  <rect x="48" y="84" width="504" height="340" rx="28" fill="url(#card-meteran-roll-5m-stanley)" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.5"/>

  <!-- Bespoke Product Illustration -->
  <g filter="url(#shadow-meteran-roll-5m-stanley)">
                    <!-- Extended Measuring Tape Blade -->
                <rect x="310" y="305" width="205" height="36" fill="#facc15" stroke="#ca8a04" stroke-width="3"/>
                <line x1="335" y1="305" x2="335" y2="322" stroke="#0f172a" stroke-width="3"/>
                <line x1="360" y1="305" x2="360" y2="328" stroke="#0f172a" stroke-width="3"/>
                <line x1="385" y1="305" x2="385" y2="322" stroke="#0f172a" stroke-width="3"/>
                <line x1="410" y1="305" x2="410" y2="328" stroke="#0f172a" stroke-width="3"/>
                <line x1="435" y1="305" x2="435" y2="322" stroke="#0f172a" stroke-width="3"/>
                <line x1="460" y1="305" x2="460" y2="328" stroke="#0f172a" stroke-width="3"/>
                <line x1="485" y1="305" x2="485" y2="322" stroke="#0f172a" stroke-width="3"/>
                <rect x="510" y="298" width="12" height="52" fill="#94a3b8" stroke="#475569" stroke-width="2"/>
                <!-- Stanley Yellow & Black Case -->
                <rect x="135" y="140" width="210" height="205" rx="42" fill="#facc15" stroke="#0f172a" stroke-width="8"/>
                <circle cx="240" cy="242" r="64" fill="#0f172a"/>
                <text x="240" y="236" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="900" fill="#facc15">STANLEY</text>
                <text x="240" y="266" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="900" fill="#ffffff">5M</text>
  </g>

  <!-- Bottom Product Label Plate -->
  <rect x="36" y="446" width="528" height="122" rx="20" fill="#0f172a" fill-opacity="0.82" stroke="#facc15" stroke-opacity="0.55" stroke-width="1.5"/>
  <text x="60" y="488" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="800" fill="#f8fafc">Meteran Roll 5m Stanley</text>
  <text x="60" y="518" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#e2e8f0"></text>
  <text x="60" y="548" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#facc15" letter-spacing="1.4">SATUAN: PCS</text>
</svg>