<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Besi Beton Polos 8mm (12m)">
  <defs>
    <linearGradient id="bg-besi-beton-polos-8mm-12m" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="card-besi-beton-polos-8mm-12m" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <filter id="shadow-besi-beton-polos-8mm-12m" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity="0.38"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" fill="url(#bg-besi-beton-polos-8mm-12m)"/>
  <circle cx="520" cy="90" r="190" fill="#f59e0b" fill-opacity="0.12"/>
  <circle cx="80" cy="520" r="210" fill="#ffffff" fill-opacity="0.05"/>

  <!-- Top Category & Store Header -->
  <rect x="36" y="32" width="190" height="34" rx="17" fill="#f59e0b"/>
  <text x="131" y="54" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="800" fill="#0f172a" letter-spacing="1.2">BAJA &amp; ATAP</text>
  <text x="564" y="54" text-anchor="end" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#cbd5e1" letter-spacing="1">TB MAJU JAYA</text>

  <!-- Center Stage Backdrop -->
  <rect x="48" y="84" width="504" height="340" rx="28" fill="url(#card-besi-beton-polos-8mm-12m)" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.5"/>

  <!-- Bespoke Product Illustration -->
  <g filter="url(#shadow-besi-beton-polos-8mm-12m)">
                    <!-- Bundle of Steel Rebar Rods -->
                <g transform="rotate(-16 300 250)">
                  <rect x="115" y="195" width="360" height="24" rx="12" fill="#94a3b8" stroke="#475569" stroke-width="3"/>
                  <rect x="125" y="228" width="360" height="24" rx="12" fill="#cbd5e1" stroke="#475569" stroke-width="3"/>
                  <rect x="110" y="261" width="360" height="24" rx="12" fill="#64748b" stroke="#334155" stroke-width="3"/>
                  <rect x="130" y="294" width="360" height="24" rx="12" fill="#94a3b8" stroke="#475569" stroke-width="3"/>
                  <rect x="260" y="185" width="75" height="145" rx="10" fill="#f59e0b"/>
                  <text x="297" y="252" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="900" fill="#0f172a">SNI</text>
                  <text x="297" y="276" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="900" fill="#0f172a">Ø 8MM</text>
                </g>
  </g>

  <!-- Bottom Product Label Plate -->
  <rect x="36" y="446" width="528" height="122" rx="20" fill="#0f172a" fill-opacity="0.82" stroke="#f59e0b" stroke-opacity="0.55" stroke-width="1.5"/>
  <text x="60" y="488" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="800" fill="#f8fafc">Besi Beton Polos 8mm</text>
  <text x="60" y="518" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#e2e8f0">(12m)</text>
  <text x="60" y="548" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#f59e0b" letter-spacing="1.4">SATUAN: BATANG</text>
</svg>