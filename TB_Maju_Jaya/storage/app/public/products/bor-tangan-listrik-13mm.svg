<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Bor Tangan Listrik 13mm">
  <defs>
    <linearGradient id="bg-bor-tangan-listrik-13mm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2540"/>
      <stop offset="100%" stop-color="#115e59"/>
    </linearGradient>
    <linearGradient id="card-bor-tangan-listrik-13mm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <filter id="shadow-bor-tangan-listrik-13mm" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity="0.38"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" fill="url(#bg-bor-tangan-listrik-13mm)"/>
  <circle cx="520" cy="90" r="190" fill="#f97316" fill-opacity="0.12"/>
  <circle cx="80" cy="520" r="210" fill="#ffffff" fill-opacity="0.05"/>

  <!-- Top Category & Store Header -->
  <rect x="36" y="32" width="190" height="34" rx="17" fill="#f97316"/>
  <text x="131" y="54" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="800" fill="#0f172a" letter-spacing="1.2">PERKAKAS &amp; ALAT</text>
  <text x="564" y="54" text-anchor="end" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#cbd5e1" letter-spacing="1">TB MAJU JAYA</text>

  <!-- Center Stage Backdrop -->
  <rect x="48" y="84" width="504" height="340" rx="28" fill="url(#card-bor-tangan-listrik-13mm)" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.5"/>

  <!-- Bespoke Product Illustration -->
  <g filter="url(#shadow-bor-tangan-listrik-13mm)">
                    <!-- Electric Impact Drill 13mm -->
                <!-- Drill Bit & Chuck -->
                <rect x="430" y="203" width="95" height="10" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
                <polygon points="375,186 430,196 430,220 375,230" fill="#475569" stroke="#1e293b" stroke-width="3"/>
                <!-- Drill Motor Housing -->
                <rect x="175" y="160" width="205" height="96" rx="22" fill="#0d9488" stroke="#134e4a" stroke-width="4"/>
                <rect x="205" y="182" width="75" height="10" rx="5" fill="#134e4a"/>
                <rect x="205" y="200" width="75" height="10" rx="5" fill="#134e4a"/>
                <rect x="205" y="218" width="75" height="10" rx="5" fill="#134e4a"/>
                <!-- Pistol Grip & Trigger -->
                <path d="M205 252 H275 L252 380 H182 Z" fill="#0d9488" stroke="#134e4a" stroke-width="4"/>
                <rect x="275" y="262" width="24" height="34" rx="6" fill="#f97316"/>
                <text x="330" y="216" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="900" fill="#ffffff">500W</text>
  </g>

  <!-- Bottom Product Label Plate -->
  <rect x="36" y="446" width="528" height="122" rx="20" fill="#0f172a" fill-opacity="0.82" stroke="#f97316" stroke-opacity="0.55" stroke-width="1.5"/>
  <text x="60" y="488" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="800" fill="#f8fafc">Bor Tangan Listrik 13mm</text>
  <text x="60" y="518" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#e2e8f0"></text>
  <text x="60" y="548" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#f97316" letter-spacing="1.4">SATUAN: PCS</text>
</svg>